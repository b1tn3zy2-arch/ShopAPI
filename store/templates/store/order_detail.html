{% extends "store/base.html" %}
{% block content %}
<h3>Заказ #{{ order_id }}</h3>
<a href="{% url 'order_add_item' order_id %}" class="btn btn-sm btn-success mb-2">+ позиция</a>
<table class="table">
  <thead><tr><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr></thead>
  <tbody>
  {% for i in items %}
    <tr><td>{{ i.product }}</td><td>{{ i.quantity }}</td>
        <td>{{ i.price }}</td><td>{{ i.subtotal }}</td></tr>
  {% empty %}<tr><td colspan="4">Позиций нет</td></tr>{% endfor %}
  </tbody>
  <tfoot><tr><th colspan="3">Итого</th><th>{{ total }}</th></tr></tfoot>
</table>
{% endblock %}
