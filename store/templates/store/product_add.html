{% extends "store/base.html" %}
{% block content %}
<h3>Добавить товар</h3>
<form method="post">{% csrf_token %}
  <div class="mb-2"><label>Имя</label>
    <input name="name" class="form-control" required></div>
  <div class="mb-2"><label>Категория</label>
    <select name="category_id" class="form-control">
      {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
    </select></div>
  <div class="mb-2"><label>Цена</label>
    <input name="price" type="number" step="0.01" class="form-control" required></div>
  <div class="mb-2"><label>Остаток</label>
    <input name="stock" type="number" class="form-control" required></div>
  <button class="btn btn-primary">Сохранить</button>
</form>
{% endblock %}
