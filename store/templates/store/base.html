<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ShopAPI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<nav class="mb-3">
  <a href="{% url 'products_list' %}" class="btn btn-sm btn-outline-primary">Товары</a>
  <a href="{% url 'product_add' %}" class="btn btn-sm btn-outline-primary">Добавить товар</a>
  <a href="{% url 'order_create' %}" class="btn btn-sm btn-outline-primary">Создать заказ</a>
  <a href="{% url 'category_stats' %}" class="btn btn-sm btn-outline-primary">Статистика</a>
  <a href="{% url 'discount' %}" class="btn btn-sm btn-outline-primary">Скидка</a>
</nav>
{% for m in messages %}
  <div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>
{% endfor %}
{% block content %}{% endblock %}
</body>
</html>
