{% extends "store/base.html" %}
{% block content %}
<h3>Изменить цену товара #{{ product_id }}</h3>
<form method="post">{% csrf_token %}
  <div class="mb-2"><label>Новая цена</label>
    <input name="price" type="number" step="0.01" class="form-control" required></div>
  <button class="btn btn-primary">Сохранить</button>
</form>
{% endblock %}
