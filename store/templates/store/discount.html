{% extends "store/base.html" %}
{% block content %}
<h3>Расчёт скидки</h3>
<form method="post">{% csrf_token %}
  <div class="mb-2"><label>ID клиента</label>
    <input name="customer_id" type="number" class="form-control" required></div>
  <div class="mb-2"><label>Сумма</label>
    <input name="amount" type="number" step="0.01" class="form-control" required></div>
  <button class="btn btn-primary">Рассчитать</button>
</form>

{% if result %}
  <div class="alert alert-info mt-3">
    Скидка: <b>{{ result.percent }}%</b><br>
    Итого к оплате: <b>{{ result.total }}</b>
  </div>
{% endif %}
{% endblock %}
